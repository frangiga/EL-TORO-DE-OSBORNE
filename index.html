<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EL TORO DE OSBORNE - Juego de Memoria</title>
    <style>
        /* --- PALETA DE COLOR Y GLOW MODERNO --- */
        :root {
            --gc-dark-bg: #061710;
            --gc-bg-gradient: radial-gradient(circle at 50% 30%, #1b4332 0%, #081c15 70%, #040e0a 100%);
            --gc-card-bg: rgba(45, 106, 79, 0.45);
            --gc-green: #028741;
            --gc-light-green: #52b788;
            --gc-accent: #74c69d;
            --glow-green: rgba(82, 183, 136, 0.5);
            --glow-gold: rgba(255, 215, 0, 0.4);
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--gc-bg-gradient);
            color: var(--white);
        }

        /* --- SELECTOR DE IDIOMAS --- */
        #language-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gc-bg-gradient);
            z-index: 1000;
            padding: 20px;
        }

        #language-selector h2 {
            color: var(--gc-accent);
            margin-bottom: 30px;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            text-align: center;
            text-shadow: 0 0 15px var(--glow-green), 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .lang-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            max-width: 520px;
            width: 100%;
        }

        /* Botón con efecto de iluminación perimetral */
        .lang-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 10px;
            border: 1px solid rgba(82, 183, 136, 0.3);
            border-radius: 16px;
            background: rgba(20, 50, 35, 0.5);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Especular suave (destello vertical al pasar el ratón) */
        .lang-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .lang-btn:hover::before {
            left: 150%;
        }

        .lang-btn:hover {
            border-color: var(--gc-light-green);
            background: rgba(45, 106, 79, 0.75);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 25px rgba(2, 135, 65, 0.4), 0 0 15px var(--glow-green);
        }

        .lang-btn img {
            width: 48px;
            height: 32px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        .lang-btn span {
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            font-weight: 600;
            color: #e0f2fe;
            letter-spacing: 0.5px;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 12px 15px;
        }

        h1 {
            color: var(--gc-accent);
            font-size: clamp(1.2rem, 3.5vw, 1.8rem);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-top: 5px;
            text-shadow: 0 0 12px var(--glow-green), 0 2px 4px rgba(0,0,0,0.8);
        }

        /* --- TABLERO DINÁMICO --- */
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(8px, 1.5vw, 14px);
            width: min(85vw, 56vh);
            height: min(85vw, 56vh);
            perspective: 1000px;
            margin: auto 0;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            border-radius: 12px;
        }

        .card:hover {
            box-shadow: 0 0 15px var(--glow-green);
        }

        .card.flip {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(82, 183, 136, 0.3);
        }

        /* Trasera con HQ.png */
        .card-back {
            background-color: var(--gc-dark-bg);
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Frente */
        .card-front {
            transform: rotateY(180deg);
            background-color: #ffffff;
            padding: 6px;
        }

        .card-front img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .img-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gc-dark-bg);
            word-break: break-all;
            padding: 4px;
        }

        /* --- FIRMA CON ENLACES --- */
        .footer-signature {
            width: 100%;
            max-width: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            padding: 8px 0;
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sig-link {
            color: var(--gc-accent);
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 8px;
        }

        .sig-link:hover {
            color: #ffffff;
            text-shadow: 0 0 8px var(--gc-light-green);
            transform: translateY(-2px);
        }

        .sig-left {
            grid-column: 1;
            text-align: center;
        }

        .sig-right {
            grid-column: 3;
            text-align: center;
        }

        /* --- VENTANA EMERGENTE (MODAL REFINADO) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(4, 14, 10, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background: linear-gradient(145deg, #1b4332 0%, #081c15 100%);
            border: 1px solid var(--gc-light-green);
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 25px var(--glow-green);
            max-width: 390px;
            width: 100%;
            animation: modalFadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.85) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h2 {
            color: #ffffff;
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--glow-green);
        }

        .modal p {
            font-size: 0.95rem;
            color: #d8f3dc;
        }

        .code-container {
            background-color: rgba(4, 14, 10, 0.9);
            border: 1px dashed var(--gc-accent);
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        #final-code {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* Botón Copiar con Glow */
        .copy-btn {
            background: linear-gradient(135deg, var(--gc-green) 0%, #015c2c 100%);
            color: var(--white);
            border: 1px solid var(--gc-light-green);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .copy-btn:hover {
            background: var(--gc-light-green);
            color: #040e0a;
            box-shadow: 0 0 12px var(--glow-green);
        }

        /* Botón Certitude con Destello */
        .certitude-btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: var(--white);
            text-decoration: none;
            padding: 13px 0;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .certitude-btn:hover {
            background: linear-gradient(135deg, #1a8cff 0%, #0066cc 100%);
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.7);
            transform: translateY(-2px);
        }

        @media (max-width: 360px) {
            .lang-options { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA SELECTOR DE IDIOMAS -->
    <div id="language-selector">
        <h2>SELECT LANGUAGE</h2>
        <div class="lang-options">
            <button class="lang-btn" onclick="startGame('es')">
                <img src="https://flagcdn.com/w80/es.png" alt="Español">
                <span>Español</span>
            </button>
            <button class="lang-btn" onclick="startGame('en')">
                <img src="https://flagcdn.com/w80/gb.png" alt="English">
                <span>English</span>
            </button>
            <button class="lang-btn" onclick="startGame('fr')">
                <img src="https://flagcdn.com/w80/fr.png" alt="Français">
                <span>Français</span>
            </button>
            <button class="lang-btn" onclick="startGame('pt')">
                <img src="https://flagcdn.com/w80/pt.png" alt="Português">
                <span>Português</span>
            </button>
            <button class="lang-btn" onclick="startGame('de')">
                <img src="https://flagcdn.com/w80/de.png" alt="Deutsch">
                <span>Deutsch</span>
            </button>
            <button class="lang-btn" onclick="startGame('it')">
                <img src="https://flagcdn.com/w80/it.png" alt="Italiano">
                <span>Italiano</span>
            </button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL JUEGO -->
    <div id="game-container">
        <h1 id="game-title">EL TORO DE OSBORNE</h1>
        
        <div id="game-board"></div>

        <!-- FIRMA CON ENLACES -->
        <footer class="footer-signature">
            <div class="sig-left">
                <a href="https://www.geocaching.com/plan/lists/BMFC2Z7" target="_blank" class="sig-link">GeoPaterna</a>
            </div>
            <div class="sig-right">
                <a href="https://www.geocaching.com/p/?guid=8aa34b6e-769c-42e2-ab66-4163f9a40e13&wid=bc617212-c64f-4373-b188-8d6e9a96b1f2&ds=2" target="_blank" class="sig-link">fran_giga</a>
            </div>
        </footer>
    </div>

    <!-- MODAL FINAL DE VICTORIA -->
    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-congrats">¡Enhorabuena!</h2>
            <p id="modal-message">Has encontrado todas las parejas.</p>
            
            <div class="code-container">
                <span id="final-code">REVIEWERS-TNKS</span>
                <button class="copy-btn" id="copy-button" onclick="copyCode()">Copiar</button>
            </div>

            <a href="https://www.certitudes.org/certitude?wp=GCBVTBN" target="_blank" class="certitude-btn" id="certitude-link">IR A CERTITUDE</a>
        </div>
    </div>

    <script>
        const translations = {
            es: { title: "EL TORO DE OSBORNE", congrats: "¡Enhorabuena!", msg: "Has resuelto el juego.", copy: "Copiar", copied: "¡Copiado!", cert: "IR A CERTITUDE" },
            en: { title: "EL TORO DE OSBORNE", congrats: "Congratulations!", msg: "You found all the pairs.", copy: "Copy", copied: "Copied!", cert: "GO TO CERTITUDE" },
            fr: { title: "EL TORO DE OSBORNE", congrats: "Félicitations!", msg: "Vous avez trouvé toutes les paires.", copy: "Copier", copied: "Copié!", cert: "ALLER À CERTITUDE" },
            pt: { title: "EL TORO DE OSBORNE", congrats: "Parabéns!", msg: "Encontrou todos os pares.", copy: "Copiar", copied: "Copiado!", cert: "IR PARA CERTITUDE" },
            de: { title: "EL TORO DE OSBORNE", congrats: "Glückwunsch!", msg: "Du hast alle Paare gefunden.", copy: "Kopieren", copied: "Kopiert!", cert: "ZUR CERTITUDE" },
            it: { title: "EL TORO DE OSBORNE", congrats: "Congratulazioni!", msg: "Hai trovato tutte le coppie.", copy: "Copia", copied: "Copiato!", cert: "VAI A CERTITUDE" }
        };

        const frontImages = [
            'Alaguait.png',
            'Clocker.jpg',
            'Gandaldore.jpg',
            'GeoawareEs.jpg',
            'Orus.png',
            'Pegmatita.jpg',
            'Salmoon.jpg',
            'Sispoglo.jpg'
        ];

        const backImage = 'HQ.png';

        let cardData = [...frontImages, ...frontImages];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;
        let currentLang = 'es';

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame(lang) {
            currentLang = lang;
            document.getElementById('language-selector').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            document.getElementById('game-title').innerText = translations[lang].title;
            document.getElementById('modal-congrats').innerText = translations[lang].congrats;
            document.getElementById('modal-message').innerText = translations[lang].msg;
            document.getElementById('copy-button').innerText = translations[lang].copy;
            document.getElementById('certitude-link').innerText = translations[lang].cert;

            setupBoard();
        }

        function createImageElement(src, altName) {
            const img = document.createElement('img');
            img.src = src;
            img.alt = altName;
            
            img.onerror = function() {
                if (img.src.includes('./')) {
                    img.src = src.replace('./', '');
                } else {
                    const fallback = document.createElement('div');
                    fallback.className = 'img-fallback';
                    fallback.innerText = altName.replace(/\.(png|jpg|jpeg)/i, '');
                    if (img.parentNode) {
                        img.parentNode.replaceChild(fallback, img);
                    }
                }
            };
            return img;
        }

        function setupBoard() {
            const gameBoard = document.getElementById('game-board');
            gameBoard.innerHTML = '';
            const shuffledCards = shuffle(cardData);
            
            shuffledCards.forEach(imgSrc => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.image = imgSrc;

                // Cara Trasera
                const cardBack = document.createElement('div');
                cardBack.classList.add('card-face', 'card-back');
                const backImg = createImageElement('./' + backImage, backImage);
                cardBack.appendChild(backImg);

                // Cara Delantera
                const cardFront = document.createElement('div');
                cardFront.classList.add('card-face', 'card-front');
                const frontImg = createImageElement('./' + imgSrc, imgSrc);
                cardFront.appendChild(frontImg);

                card.appendChild(cardBack);
                card.appendChild(cardFront);

                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flip');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.image === secondCard.dataset.image;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            matchedPairs++;
            resetBoard();

            if (matchedPairs === frontImages.length) {
                setTimeout(() => {
                    document.getElementById('end-modal').style.display = 'flex';
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flip');
                secondCard.classList.remove('flip');
                resetBoard();
            }, 900);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function copyCode() {
            const codeText = document.getElementById('final-code').innerText;
            const btn = document.getElementById('copy-button');
            
            navigator.clipboard.writeText(codeText).then(() => {
                btn.innerText = translations[currentLang].copied;
                btn.style.backgroundColor = 'var(--gc-light-green)';
                setTimeout(() => {
                    btn.innerText = translations[currentLang].copy;
                    btn.style.backgroundColor = 'var(--gc-green)';
                }, 2000);
            });
        }
    </script>
</body>
</html>
